name: Build iOS Cheat Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: |
        xcode-select -p
        xcrun --sdk iphoneos --show-sdk-path
        clang++ --version

    - name: Compile Cheat.dylib with ImGui
      run: |
        set -e
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        
        # 1. ImGui core (C++)
        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./imgui -I./imgui/backends -std=c++11 \
          imgui/imgui.cpp -o imgui.o
        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./imgui -I./imgui/backends -std=c++11 \
          imgui/imgui_draw.cpp -o imgui_draw.o
        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./imgui -I./imgui/backends -std=c++11 \
          imgui/imgui_tables.cpp -o imgui_tables.o
        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./imgui -I./imgui/backends -std=c++11 \
          imgui/imgui_widgets.cpp -o imgui_widgets.o
        
        # 2. Metal бэкенд (без ARC)
        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./imgui -I./imgui/backends \
          -fno-objc-arc -Wno-deprecated-declarations \
          imgui/backends/imgui_impl_metal.mm -o imgui_impl_metal.o
        
        # 3. Cheat.mm (с ARC)
        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./imgui -I./imgui/backends \
          -fobjc-arc -std=c++11 -Wno-deprecated-declarations \
          Cheat.mm -o Cheat.o
        
        # 4. Линковка ← ДОБАВЛЕН QuartzCore
        clang++ -dynamiclib -arch arm64 \
          -isysroot $SDK \
          -miphoneos-version-min=14.0 \
          imgui.o imgui_draw.o imgui_tables.o imgui_widgets.o \
          imgui_impl_metal.o Cheat.o \
          -o Cheat.dylib \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -framework Metal \
          -framework MetalKit \
          -framework QuartzCore \
          2>&1 | tee build.log
        
        ls -la Cheat.dylib
        file Cheat.dylib

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Cheat.dylib
        path: Cheat.dylib

    - name: Show build log on failure
      if: failure()
      run: cat build.log || echo "No log"
