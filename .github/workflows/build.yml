name: Build iOS Cheat Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Cheat.dylib
      run: |
        clang++ -dynamiclib \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=14.0 \
          -fobjc-arc \
          Cheat.mm \
          -o Cheat.dylib \
          -framework UIKit -framework Foundation
        ls -la Cheat.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cheat.dylib
        path: Cheat.dylib
