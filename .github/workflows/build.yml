name: Build iOS Cheat Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: |
        xcode-select -p
        xcrun --sdk iphoneos --show-sdk-path
        clang++ --version

    - name: Compile Cheat.dylib with ImGui
      run: |
        set -e
        clang++ -dynamiclib \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=14.0 \
          -fobjc-arc \
          -O2 \
          -I./imgui \
          -I./imgui/backends \
          Cheat.mm \
          imgui/imgui.cpp \
          imgui/imgui_draw.cpp \
          imgui/imgui_tables.cpp \
          imgui/imgui_widgets.cpp \
          imgui/backends/imgui_impl_metal.mm \
          -o Cheat.dylib \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -framework Metal \
          -framework MetalKit \
          2>&1 | tee build.log
        ls -la Cheat.dylib
        file Cheat.dylib

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Cheat.dylib
        path: Cheat.dylib

    - name: Show build log on failure
      if: failure()
      run: cat build.log || echo "No log"
