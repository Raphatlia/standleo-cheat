name: Build Cheat

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build Cheat.dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)

        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./ -I./imgui -I./imgui/backends \
          -fno-objc-arc -std=c++17 -Wno-deprecated-declarations \
          imgui/imgui.cpp -o imgui.o

        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./ -I./imgui -I./imgui/backends \
          -fno-objc-arc -std=c++17 -Wno-deprecated-declarations \
          imgui/imgui_draw.cpp -o imgui_draw.o

        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./ -I./imgui -I./imgui/backends \
          -fno-objc-arc -std=c++17 -Wno-deprecated-declarations \
          imgui/imgui_widgets.cpp -o imgui_widgets.o

        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./ -I./imgui -I./imgui/backends \
          -fno-objc-arc -std=c++17 -Wno-deprecated-declarations \
          imgui/imgui_tables.cpp -o imgui_tables.o

        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./ -I./imgui -I./imgui/backends \
          -fno-objc-arc -std=c++17 -Wno-deprecated-declarations \
          imgui/backends/imgui_impl_metal.mm -o imgui_impl_metal.o

        clang++ -c -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 \
          -I./ -I./imgui -I./imgui/backends \
          -fobjc-arc -std=c++17 -Wno-deprecated-declarations \
          Cheat.mm -o Cheat.o

        clang++ -shared -arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 \
          imgui.o imgui_draw.o imgui_widgets.o imgui_tables.o imgui_impl_metal.o Cheat.o \
          -framework UIKit -framework Metal -framework QuartzCore -framework CoreGraphics \
          -o Cheat.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cheat.dylib
        path: Cheat.dylib
